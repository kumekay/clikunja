name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --all-extras --python ${{ matrix.python }}
      - name: Run tests
        run: uv run pytest -v

  e2e:
    name: e2e (real Vikunja)
    runs-on: ubuntu-latest
    needs: [pre-commit, test]
    # Skip on PRs from forks — they cannot access repository secrets.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    concurrency:
      group: clikunja-e2e-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install clikunja
        run: uv tool install --python 3.11 .
      - name: Run e2e smoke
        env:
          VIKUNJA_URL: ${{ secrets.VIKUNJA_URL }}
          VIKUNJA_TOKEN: ${{ secrets.VIKUNJA_TOKEN }}
        run: |
          if [ -z "$VIKUNJA_URL" ] || [ -z "$VIKUNJA_TOKEN" ]; then
            echo "::notice::VIKUNJA_URL / VIKUNJA_TOKEN secrets missing; skipping e2e"
            exit 0
          fi
          bash scripts/e2e.sh
