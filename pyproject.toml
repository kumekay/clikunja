[project]
name = "clikunja"
version = "0.1.0"
description = "CLI for Vikunja TODO"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "clikunja contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6",
    "platformdirs>=4",
]

[project.scripts]
clikunja = "clikunja.cli:app"

[project.urls]
Homepage = "https://github.com/kumekay/clikunja"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clikunja"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: typer relies on calling `typer.Option(...)` in defaults.
ignore = ["E501", "B008"]

[tool.coverage.run]
source = ["src/clikunja"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
